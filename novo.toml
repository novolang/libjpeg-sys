[package]
name        = "libjpeg-sys"
version     = "0.1.1"
description = "Bindings over libturbojpeg, the TurboJPEG interface of libjpeg-turbo: the compressor, the decompressor with its header reader and scaling factors, the planar YUV conversions, the buffer allocator and the error reporting, one declaration per C entry point."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used
# the package yet, and the tests exercise the entry points rather than
# a consumer's use of them.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libturbojpeg.
layer       = "sys"

category    = "bindings"

# The one C library.  libjpeg-turbo ships two C interfaces in two
# shared libraries: `libjpeg.so` carries the libjpeg API, and
# `libturbojpeg.so` carries the TurboJPEG API.  This package binds the
# TurboJPEG one, which is the only one of the two a novo-lang program
# can call.  The libjpeg entry points work on a `jpeg_compress_struct`
# or a `jpeg_decompress_struct` the caller allocates, and
# `jpeg_CreateCompress` takes the library version and the structure's
# size as arguments and refuses any other numbers.  Both are
# build-time facts only the C header knows, and the library's default
# error handler answers a wrong one by printing a line such as
# "JPEG parameter struct mismatch" and calling `exit`.  A novo-lang
# program has no header, so it cannot make the first call of that API.
# Every TurboJPEG entry point takes an opaque handle and scalars.  The
# README's "What is not included" section says so again.
wraps       = "libturbojpeg"

tags        = ["ffi", "jpeg", "turbojpeg", "libjpeg-turbo", "image", "codec", "bindings"]
repository  = "https://github.com/novolang/libjpeg-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libturbojpeg, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "turbojpeg"` name every declaration
# in `src/` carries.  `libturbojpeg0-dev` installs
# `/usr/lib/<arch>/pkgconfig/libturbojpeg.pc`, so pkg-config answers
# `-lturbojpeg` on Debian and Ubuntu.  Without the block the default is
# `-lturbojpeg`, which is the same flag on a system that put the
# library somewhere the linker already looks.
[ffi.turbojpeg]
pkg_config = "libturbojpeg"
